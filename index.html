<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Shahiq Imam · Full-Stack Developer</title>
    <meta name="description" content="Shahiq Imam: full-stack software developer (TypeScript, React, Next.js, NestJS, PostgreSQL, Docker) focused on cyber security and DevOps. Play through the interactive résumé or open the quick view." />
    <meta property="og:title" content="Shahiq Imam · Full-Stack Developer" />
    <meta property="og:description" content="An interactive, scroll-through résumé: full-stack, cyber security & DevOps." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#1b1b2f" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <a class="skip" href="#quick" data-mode="quick">Skip to quick résumé</a>

    <header class="hud" id="hud">
      <a class="hud-logo" href="#" data-mode="world" aria-label="Shahiq Imam, back to start">SI<span>_</span></a>
      <div class="hud-zone" aria-live="polite">
        <span class="hud-zone-label" id="zone-label">Boot</span>
        <div class="hud-map" id="hud-map" role="navigation" aria-label="Jump to zone"></div>
      </div>
      <div class="hud-actions">
        <span class="hud-coins" id="coins" title="Skills collected">◆ <b id="coin-count">0</b>/<span id="coin-total">0</span></span>
        <button class="btn btn-quick" id="mode-toggle" type="button">Quick view</button>
        <a class="btn btn-ghost hud-resume" href="/Shahiq-Imam-Resume.pdf" download>Résumé ↓</a>
      </div>
    </header>

    <main id="world-mode">
      <div class="scroller" id="scroller">
        <div class="stage" id="stage">
          <div class="sky" id="sky"></div>
          <div class="stars" id="stars"></div>
          <div class="sun" id="sun"></div>
          <div class="layer layer-clouds" id="layer-clouds"></div>
          <div class="layer layer-far" id="layer-far"></div>
          <div class="layer layer-mid" id="layer-mid"></div>
          <div class="world" id="world"></div>
          <div class="hero" id="hero" aria-hidden="true"></div>
          <div class="hint" id="hint"><span class="k">Scroll or use ← → to explore</span><span class="t">Swipe up to explore</span></div>
        </div>
      </div>
    </main>

    <section id="quick" class="quick" hidden></section>

    <dialog id="project-dialog" class="pdialog" aria-labelledby="pd-title"></dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
